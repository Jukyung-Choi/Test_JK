<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모든 미션 완료!</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    background: #1a1a2e;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, 'Apple SD Gothic Neo', sans-serif;
  }

  /* ── 375×812 Phone shell ── */
  .phone {
    width: 375px;
    height: 812px;
    background: linear-gradient(to bottom, #0e0040 0%, #5d0f69 85%);
    position: relative;
    overflow: hidden;       /* clips confetti inside the frame */
    flex-shrink: 0;
    color: white;
  }

  /* Scroll area inside phone */
  .phone-scroll {
    width: 100%;
    height: 100%;
    overflow-y: auto;
    overflow-x: hidden;
    position: relative;
    /* hide native scrollbar */
    scrollbar-width: none;
  }
  .phone-scroll::-webkit-scrollbar { display: none; }

  /* ── Confetti canvas — absolute inside .phone ── */
  #confetti-canvas {
    position: absolute;
    top: 0; left: 0;
    width: 375px;
    height: 812px;
    pointer-events: none;
    z-index: 999;
  }

  /* ── Status Bar ── */
  .status-bar {
    background: #180245;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px 0;
    height: 44px;
    flex-shrink: 0;
  }
  .status-time { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; }
  .status-icons { display: flex; gap: 6px; align-items: center; }

  /* ── Nav ── */
  .nav {
    background: #180245;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    flex-shrink: 0;
  }
  .close-btn {
    width: 24px; height: 24px;
    cursor: pointer; position: relative;
  }
  .close-btn::before, .close-btn::after {
    content: ''; position: absolute;
    top: 50%; left: 50%;
    width: 14px; height: 1.5px;
    background: white; border-radius: 2px;
  }
  .close-btn::before { transform: translate(-50%,-50%) rotate(45deg); }
  .close-btn::after  { transform: translate(-50%,-50%) rotate(-45deg); }

  /* ── Hero ── */
  .hero {
    padding: 28px 18px 24px;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .hero-title { font-size: 34px; font-weight: 700; line-height: 1.2; }
  .hero-sub   { font-size: 14px; font-weight: 500; color: rgba(255,255,255,0.7); line-height: 20px; }

  /* ── Card Grid ── */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(2, 158px);
    gap: 14px;
    padding: 0 18px 60px;
    justify-content: center;
  }
  .card {
    width: 158px; height: 186px;
    border-radius: 10px;
    overflow: hidden;
    position: relative;
  }
  .card-img {
    width: 100%; height: 212px;
    object-fit: cover;
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
  }
  .card-dim {
    position: absolute;
    bottom: 0; left: 0; right: 0; height: 72px;
    background: linear-gradient(to bottom, rgba(167,100,180,0), #a764b4);
  }
  .card-label {
    position: absolute;
    bottom: 10px; left: 0; right: 0;
    text-align: center;
    font-size: 12px;
    color: white;
    padding: 0 10px;
  }

  /* ── Home Indicator ── */
  .home-indicator {
    height: 34px;
    display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: 9px;
  }
  .home-bar {
    width: 134px; height: 5px;
    background: rgba(0,0,0,0.5);
    border-radius: 100px;
  }
</style>
</head>
<body>
<div class="phone">

  <!-- Confetti canvas lives inside .phone so it clips correctly -->
  <canvas id="confetti-canvas"></canvas>

  <div class="phone-scroll">
    <!-- Status Bar -->
    <div class="status-bar">
      <span class="status-time">9:41</span>
      <div class="status-icons">
        <svg width="17" height="12" viewBox="0 0 17 12" fill="none">
          <rect x="0" y="7" width="3" height="5" rx="0.8" fill="white" opacity="0.4"/>
          <rect x="4.7" y="4.5" width="3" height="7.5" rx="0.8" fill="white" opacity="0.6"/>
          <rect x="9.4" y="2" width="3" height="10" rx="0.8" fill="white" opacity="0.8"/>
          <rect x="14.1" y="0" width="3" height="12" rx="0.8" fill="white"/>
        </svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="white">
          <path d="M8 2.8C10 2.8 11.8 3.6 13.1 4.9L14.5 3.5C12.8 1.9 10.5 1 8 1C5.5 1 3.2 1.9 1.5 3.5L2.9 4.9C4.2 3.6 6 2.8 8 2.8Z" opacity="0.4"/>
          <path d="M8 5.4C9.4 5.4 10.7 5.9 11.7 6.8L13.1 5.4C11.7 4.2 9.9 3.4 8 3.4C6.1 3.4 4.3 4.2 2.9 5.4L4.3 6.8C5.3 5.9 6.6 5.4 8 5.4Z" opacity="0.7"/>
          <path d="M8 8C9 8 9.9 8.4 10.6 9.1L8 12L5.4 9.1C6.1 8.4 7 8 8 8Z"/>
        </svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none">
          <rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="white" stroke-opacity="0.35"/>
          <rect x="2" y="2" width="17" height="8" rx="2" fill="white"/>
          <path d="M23 4.5V7.5C23.8 7.2 24.5 6.7 24.5 6C24.5 5.3 23.8 4.8 23 4.5Z" fill="white" opacity="0.4"/>
        </svg>
      </div>
    </div>

    <!-- Nav -->
    <div class="nav">
      <div class="close-btn"></div>
      <div style="width:24px;opacity:0"></div>
    </div>

    <!-- Hero -->
    <div class="hero">
      <div class="hero-title">모든 미션 완료!</div>
      <div class="hero-sub">다른 캐릭터도 만나러 가볼까요?</div>
    </div>

    <!-- Cards -->
    <div class="card-grid" id="cardGrid"></div>

    <!-- Home Indicator -->
    <div class="home-indicator"><div class="home-bar"></div></div>
  </div><!-- /phone-scroll -->

</div><!-- /phone -->

<script>
// ── Build 10 cards ───────────────────────────────────────────────────
const IMG = 'https://www.figma.com/api/mcp/asset/7f80192b-b5d9-4fa2-8e3e-74e3eb5a9f48';
const grid = document.getElementById('cardGrid');
for (let i = 0; i < 10; i++) {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <img class="card-img" src="${IMG}" alt="">
    <div class="card-dim"></div>
    <div class="card-label">당신만 바라보는 남사친</div>`;
  grid.appendChild(card);
}

// ── Holographic confetti — runs ONCE per page load ───────────────────
(function() {
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  const W = 375, H = 812;
  canvas.width  = W;
  canvas.height = H;

  // Light pink palette
  const PINKS = [
    [255, 182, 204],  // #ffb6cc
    [255, 210, 225],  // #ffd2e1
    [255, 240, 246],  // #fff0f6
    [255, 156, 183],  // #ff9cb7
    [252, 230, 240],  // #fce6f0
    [250, 245, 255],  // #faf5ff — lavender-white
    [255, 224, 236],  // #ffe0ec
  ];

  function makeParticle() {
    const base = PINKS[Math.floor(Math.random() * PINKS.length)];
    const w = Math.random() * 10 + 5;
    const h = w * (Math.random() * 0.35 + 0.25);
    const shape = ['rect','circle','ribbon'][Math.floor(Math.random() * 3)];
    return {
      x: Math.random() * W,
      y: Math.random() * -80 - 10,          // start above canvas
      vx: (Math.random() - 0.5) * 3,
      vy: Math.random() * 3 + 1.5,
      w, h,
      angle: Math.random() * Math.PI * 2,
      spin: (Math.random() - 0.5) * 0.16,
      base,                                  // [r,g,b]
      hueBase:   Math.random() * 360,        // starting rainbow hue
      hueSpeed:  Math.random() * 2 + 0.8,   // hue deg/frame
      shimmer:   Math.random() * 0.5 + 0.55,// shimmer intensity
      wobble:    Math.random() * Math.PI * 2,
      wobbleSpd: Math.random() * 0.05 + 0.02,
      opacity: 1,
      life: 0,
      maxLife: Math.random() * 140 + 100,
      shape,
    };
  }

  const particles = [];
  for (let i = 0; i < 130; i++) particles.push(makeParticle());

  let frame = 0;

  function drawPiece(p) {
    const hw = p.w / 2, hh = p.h / 2;

    // 1. Base pink
    ctx.fillStyle = `rgb(${p.base[0]},${p.base[1]},${p.base[2]})`;
    tracePath(p, hw, hh);
    ctx.fill();

    // 2. Holographic rainbow sweep
    //    A linear gradient whose direction rotates each frame
    const hue1 = (p.hueBase + frame * p.hueSpeed) % 360;
    const hue2 = (hue1 + 80) % 360;
    const hue3 = (hue1 + 160) % 360;
    const sweepAngle = ((frame * 1.8 * p.hueSpeed) % 360) * Math.PI / 180;
    const dx = Math.cos(sweepAngle) * hw * 1.6;
    const dy = Math.sin(sweepAngle) * hh * 1.6;
    const g = ctx.createLinearGradient(-dx, -dy, dx, dy);
    const a = p.shimmer * 0.8;
    g.addColorStop(0,    `hsla(${hue1},100%,80%,0)`);
    g.addColorStop(0.25, `hsla(${hue1},100%,82%,${a})`);
    g.addColorStop(0.5,  `hsla(${hue2},100%,96%,${Math.min(1, a * 1.4)})`); // white-ish peak
    g.addColorStop(0.75, `hsla(${hue3},100%,80%,${a})`);
    g.addColorStop(1,    `hsla(${hue3},100%,80%,0)`);
    ctx.fillStyle = g;
    tracePath(p, hw, hh);
    ctx.fill();

    // 3. Specular dot — tiny bright flare that moves around
    const sx = Math.cos(sweepAngle * 1.3) * hw * 0.35;
    const sy = Math.sin(sweepAngle * 1.3) * hh * 0.35;
    const spot = ctx.createRadialGradient(sx, sy, 0, sx, sy, hw * 0.8);
    spot.addColorStop(0,   `rgba(255,255,255,${0.7 * p.shimmer})`);
    spot.addColorStop(0.5, `rgba(255,255,255,${0.2 * p.shimmer})`);
    spot.addColorStop(1,   'rgba(255,255,255,0)');
    ctx.fillStyle = spot;
    tracePath(p, hw, hh);
    ctx.fill();
  }

  // Draws the clip path for a given shape centered at (0,0)
  function tracePath(p, hw, hh) {
    ctx.beginPath();
    if (p.shape === 'circle') {
      ctx.ellipse(0, 0, hw, hw * 0.85, 0, 0, Math.PI * 2);
    } else if (p.shape === 'ribbon') {
      ctx.moveTo(-hw, 0);
      ctx.bezierCurveTo(-hw * 0.5, -hh * 2, hw * 0.5, hh * 2, hw, 0);
      ctx.bezierCurveTo(hw * 0.5, -hh, -hw * 0.5, hh, -hw, 0);
    } else {
      // rounded rect
      const r = Math.min(1.5, hw * 0.2);
      ctx.moveTo(-hw + r, -hh);
      ctx.lineTo(hw - r, -hh);
      ctx.quadraticCurveTo(hw, -hh, hw, -hh + r);
      ctx.lineTo(hw, hh - r);
      ctx.quadraticCurveTo(hw, hh, hw - r, hh);
      ctx.lineTo(-hw + r, hh);
      ctx.quadraticCurveTo(-hw, hh, -hw, hh - r);
      ctx.lineTo(-hw, -hh + r);
      ctx.quadraticCurveTo(-hw, -hh, -hw + r, -hh);
      ctx.closePath();
    }
  }

  function tick() {
    ctx.clearRect(0, 0, W, H);
    frame++;

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];

      // Physics
      p.x      += p.vx + Math.sin(p.wobble) * 0.7;
      p.y      += p.vy;
      p.vy     += 0.045;
      p.angle  += p.spin;
      p.wobble += p.wobbleSpd;
      p.life++;

      // Fade out
      const fadeAt = p.maxLife * 0.68;
      p.opacity = p.life < fadeAt
        ? 1
        : Math.max(0, 1 - (p.life - fadeAt) / (p.maxLife - fadeAt));

      if (p.opacity <= 0 || p.y > H + 30) { particles.splice(i, 1); continue; }

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.angle);
      ctx.globalAlpha = p.opacity;
      drawPiece(p);
      ctx.restore();
    }

    if (particles.length > 0) {
      requestAnimationFrame(tick);
    } else {
      ctx.clearRect(0, 0, W, H);
    }
  }

  // Slight delay so layout settles first
  setTimeout(() => requestAnimationFrame(tick), 60);
})();
</script>
</body>
</html>
