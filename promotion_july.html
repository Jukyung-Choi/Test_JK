  100% { transform: translateX(220%); }
}
.s2-btn {
  overflow: hidden;
}
.s2-btn::after {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 45%;
  height: 100%;
  background: linear-gradient(
    105deg,
    transparent 0%,
    rgba(255,255,255,0.18) 40%,
    rgba(255,255,255,0.32) 50%,
    rgba(255,255,255,0.18) 60%,
    transparent 100%
  );
  transform: translateX(-120%);
  animation: btn-sweep 2.4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
  animation-delay: 0.6s;
  pointer-events: none;
}

/* ── 2. CTA 깜빡임 ── */

<script>
// ─────────────────────────────────────────────
//  상태값: 1 / 3 / 7 중 하나로 변경
// ─────────────────────────────────────────────
const progressState = 3;

// ─────────────────────────────────────────────
//  Progress bar 상수 (Figma 측정값)
//  track width  : 328px
//  step dot size: 22px
//  total steps  : 7
//  gap          : (328 - 7×22) / (7-1) = 29px
//  step i(0-based) center offset = i × (22+29) + 11
// ─────────────────────────────────────────────
const TOTAL_STEPS   = 7;
const TRACK_WIDTH   = 328;   // px
const DOT_SIZE      = 22;    // px
const GAP           = (TRACK_WIDTH - TOTAL_STEPS * DOT_SIZE) / (TOTAL_STEPS - 1); // 29px
const TRACK_LEFT    = 24;    // px — progress-fill left edge (= track left edge)

function getStepCenterOffset(zeroBasedIndex) {
  return zeroBasedIndex * (DOT_SIZE + GAP) + DOT_SIZE / 2;
}

function calcFillWidth(state) {
  // fill reaches the right edge of the target step dot
  return getStepCenterOffset(state - 1) + DOT_SIZE / 2;
}

function applyProgressState(state) {
  // 1. 프로그레스 fill 길이 업데이트
  const fill = document.querySelector('.progress-fill');
  const fillWidth = calcFillWidth(state);
  fill.style.left      = TRACK_LEFT + 'px';
  fill.style.transform = 'none';
  fill.style.width     = fillWidth + 'px';

  // 2. 보상 말풍선 활성 / 비활성 전환
  document.querySelectorAll('[data-reward-step]').forEach(function(bubble) {
    const step     = parseInt(bubble.dataset.rewardStep, 10);
    const inner    = bubble.querySelector('.bubble-inner');
    const text     = bubble.querySelector('.bubble-text');
    const tailImg  = bubble.querySelector('.tail-img');
    const isActive = step <= state;

    // bubble-inner background
    inner.classList.toggle('active',   isActive);
    inner.classList.toggle('inactive', !isActive);

    // bubble text color
    text.classList.toggle('active-text',   isActive);
    text.classList.toggle('inactive-text', !isActive);

    // 꼬리 이미지 — 원본 Figma 에셋 그대로, src만 교체 (크기·위치·회전 변경 없음)
    // 활성: imgBubbleTailBottom(흰색), 비활성: imgBubbleTailBottom1(자주색)
    if (tailImg) {
      tailImg.src = isActive ? bubble.dataset.tailActive : bubble.dataset.tailInactive;
    }
  });
}

// 페이지 로드 시 즉시 적용
applyProgressState(progressState);

// ─────────────────────────────────────────────
//  Screen toggle
// ─────────────────────────────────────────────
document.querySelector('.btn').addEventListener('click', function () {
  document.getElementById('screen1').style.display = 'none';
  document.getElementById('screen2').style.display = 'block';
  carouselInit();
});
document.getElementById('s2-xbtn').addEventListener('click', function () {

  document.getElementById('screen1').style.display = 'block';
});

// screen2 CTA → screen3 → screen4 (자동 전환)
document.getElementById('s2-cta').addEventListener('click', function () {
  document.getElementById('screen2').style.display = 'none';
  document.getElementById('screen3').style.display = 'block';
  setTimeout(showScreen4, 4000);

function showScreen4() {
  document.getElementById('screen3').style.display = 'none';
  var s4 = document.getElementById('screen4');
  s4.style.display = 'block';

  // nickname 등장
  requestAnimationFrame(function() {
    requestAnimationFrame(function() {
      document.querySelector('.s4-name').classList.add('s4-show');
      // 0.5초 후 대사 등장
      setTimeout(function() {
        document.querySelector('.s4-quote').classList.add('s4-show');

}

// screen4 X → screen1
// 다운로드 버튼 → 토스트
var s4ToastTimer = null;
document.querySelector('.s4-dl').addEventListener('click', function () {
  var toast = document.getElementById('s4-toast');
  if (s4ToastTimer) { clearTimeout(s4ToastTimer); s4ToastTimer = null; }
  toast.classList.remove('show', 'hide');
  void toast.offsetWidth; // reflow
  toast.classList.add('show');
  s4ToastTimer = setTimeout(function () {
    toast.classList.remove('show');
    toast.classList.add('hide');
    s4ToastTimer = null;
  }, 1000);
});

document.getElementById('s4-xbtn').addEventListener('click', function () {
  document.getElementById('screen4').style.display = 'none';
  document.querySelector('.s4-name').classList.remove('s4-show');
  document.querySelector('.s4-quote').classList.remove('s4-show');
  document.getElementById('screen1').style.display = 'block';
});

// screen4 "대화하러 가기" → screen5
document.querySelector('.s4-chat').addEventListener('click', function () {
  document.getElementById('screen4').style.display = 'none';
  document.getElementById('screen5').style.display = 'block';
});

// screen5: 화면 어디든 터치 → screen1
document.getElementById('screen5').addEventListener('click', function () {
  document.getElementById('screen5').style.display = 'none';
  document.querySelector('.s4-name').classList.remove('s4-show');
  document.querySelector('.s4-quote').classList.remove('s4-show');
  document.getElementById('screen1').style.display = 'block';
});

// ─────────────────────────────────────────────
//  Carousel — iOS 네이티브 스타일
//  translateX + scale, transform-origin:center
// ─────────────────────────────────────────────
var CIMG = 'https://www.figma.com/api/mcp/asset/0ab2cd6b-ce91-42d5-93af-3ec8c7de4f94';
var CFI1 = 'https://www.figma.com/api/mcp/asset/a2c48974-fbd2-4c79-a41b-abf62cf7de08';
var CFI2 = 'https://www.figma.com/api/mcp/asset/ee084c00-6e23-4b13-8042-f32c2084b7e7';
var CFI3 = 'https://www.figma.com/api/mcp/asset/80e06d27-a17f-49d5-a619-33a5922a15f5';

var CARDS_DATA = [
  { name: '차도남 선배',    desc: '왜 자꾸 신경쓰이게 하는 건데.\n이러지 마.' },
  { name: '싸가지 일진남',  desc: '하씨.. 너 뭔데 계속\n신경쓰이게 하냐.' },
  { name: '순정남 반장',    desc: '너만 보면 왜 이렇게\n마음이 설레는 걸까.' },
  { name: '냉혹한 재벌남',  desc: '관심 없어. 근데 왜\n계속 눈에 띄는 거야.' },
  { name: '설렘의 왕자',    desc: '네가 날 피하면\n더 쫓아갈 거야.' },
  { name: '순수 소년',      desc: '나 너 좋아하는 것\n같아. 어떡하지?' },
  { name: '늑대 길들이기',  desc: '너가 내 주인이야.\n어딜 가든 따라가.' },
  { name: '비밀 천재남',    desc: '... 너만 알고 있어.\n내 진짜 모습.' },
  { name: '선한 눈의 남자', desc: '솔직히 말할게.\n너 없으면 안 되겠어.' },
];

var C_PITCH = 260;
var C_SCALE = 0.93;
var C_OPA   = 0.78;

var cIdx      = 0;
var cDrag     = 0;
var cDragging = false;
var cBuilt    = false;
var VEL_BUF   = [];

function cPushVel(v) {
  var now = Date.now();
  VEL_BUF.push({ v: v, t: now });
  while (VEL_BUF.length > 1 && now - VEL_BUF[0].t > 80) VEL_BUF.shift();
}
function cRollingVel() {
  if (!VEL_BUF.length) return 0;
  var sum = 0, w = 0;
  for (var i = 0; i < VEL_BUF.length; i++) {
    var weight = i + 1;
    sum += VEL_BUF[i].v * weight; w += weight;
  }
  return sum / w;
}

function makeCardHTML(d) {
  return '<div class="s2-chr"><img src="'+ CIMG +'" alt=""></div>' +
    '<div class="s2-dim"></div>' +
    '<div class="s2-f s2-f1"><img src="'+ CFI1 +'" alt=""></div>' +
    '<div class="s2-f s2-f2"><img src="'+ CFI2 +'" alt=""></div>' +
    '<div class="s2-f s2-f3"><img src="'+ CFI3 +'" alt=""></div>' +
    '<div class="s2-bdr"></div>' +
    '<div class="s2-sh s2-sh1"><div class="s2-shb"></div></div>' +
    '<div class="s2-sh s2-sh2"><div class="s2-shb"></div></div>' +
    '<div class="s2-info">' +
      '<div class="s2-pill"><span>'+ d.name +'</span></div>' +
      '<p class="s2-desc">'+ d.desc.replace(/\n/g,'<br>') +'</p>' +
    '</div>';
}

// Circular slot for card i given current center cIdx
// Returns slot (-2~+2) or null if the card should be hidden
function cCircularSlot(i, N) {
  var off = ((i - cIdx) % N + N) % N;
  if (off > N / 2) off -= N;
  return (Math.abs(off) <= 2) ? off : null;
}

/*
  Single render — drag mode or snap mode.
  isDragging=true  → transition:none
  isDragging=false → spring transition
*/
function cApply(cards, isDragging) {
  var N    = cards.length;
  var drag = cDrag;

  cards.forEach(function(c, i) {
    var slot = cCircularSlot(i, N);

    // hide cards not in visible range
    if (slot === null) {
      c.style.transition   = 'none';
      c.style.opacity      = '0';
      c.style.pointerEvents= 'none';
      c.classList.remove('is-center', 'is-side');
      return;
    }

    // position: slot × pitch + drag (center card follows 1:1, others follow proportionally)
    var pull = isDragging ? Math.pow(0.5, Math.abs(slot)) : 0;
    var tx   = slot * C_PITCH + drag * (slot === 0 ? 1 : pull * 0.45);

    // normalised distance for scale/opacity
    var t  = Math.min(Math.abs(tx) / C_PITCH, 1);
    var sc = 1 - t * (1 - C_SCALE);
    var op = 1 - t * (1 - C_OPA);

    // subtle fixed rotateY on side cards (7deg); center leans slightly during drag (max 3deg)
    var ry = slot !== 0 ? (slot < 0 ? 7 : -7) : 0;
    if (isDragging && slot === 0) ry = Math.max(-3, Math.min(3, -drag * 0.016));

    if (!isDragging) {
      c.style.transition = 'transform 400ms cubic-bezier(0.22,1,0.36,1), opacity 300ms ease';
    } else {
      c.style.transition = 'none';
    }

    c.style.transform    = 'translateX('+tx+'px) scale('+sc+') rotateY('+ry+'deg)';
    c.style.opacity      = String(Math.max(0, op));
    c.style.zIndex       = Math.abs(slot) === 0 ? 3 : Math.abs(slot) === 1 ? 2 : 1;
    c.style.pointerEvents= '';
    c.classList.toggle('is-center', slot === 0);
    c.classList.toggle('is-side',   slot !== 0);
  });
}

function cBounceIndicator() {
  var sel = document.querySelector('.s2-sel');
  if (!sel) return;
  sel.classList.remove('bouncing');
  void sel.offsetWidth;
  sel.classList.add('bouncing');
  sel.addEventListener('animationend', function(){ sel.classList.remove('bouncing'); }, { once: true });
}

function carouselInit() {
  if (cBuilt) return;
  cBuilt = true;

  var stage  = document.getElementById('s2-stage');
  var lastX  = 0, lastT = 0, startX = 0, rafId = null;

  CARDS_DATA.forEach(function(d) {
    var el = document.createElement('div');
    el.className = 's2-card';
    el.innerHTML = makeCardHTML(d);
    stage.appendChild(el);
  });

  var cards = Array.from(stage.querySelectorAll('.s2-card'));
  var N = cards.length;
  cApply(cards, false);

  // Side card tap to jump (circular)
  stage.addEventListener('click', function(e) {
    if (Math.abs(cDrag) > 6) return;
    var card = e.target.closest('.s2-card');
    if (!card) return;
    var i    = cards.indexOf(card);
    var slot = cCircularSlot(i, N);
    if (slot !== null && slot !== 0) {
      cIdx = ((cIdx + slot) % N + N) % N;
      cDrag = 0; VEL_BUF = [];
      cApply(cards, false);
      cBounceIndicator();
    }
  });

  function onStart(x) {
    cDragging = true;
    startX = x - cDrag;
    lastX  = x; lastT = Date.now();
    VEL_BUF = [];
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  }

  function onMove(x) {
    if (!cDragging) return;
    var now = Date.now();
    cPushVel((x - lastX) / Math.max(now - lastT, 1));
    lastX = x; lastT = now;
    cDrag = x - startX;
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(function() {
      cApply(cards, true);
      rafId = null;
    });
  }

  function onEnd() {
    if (!cDragging) return;
    cDragging = false;
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }

    var proj = cDrag + cRollingVel() * 160;
    if      (proj < -(C_PITCH * 0.22)) cIdx = (cIdx + 1) % N;
    else if (proj >  (C_PITCH * 0.22)) cIdx = (cIdx - 1 + N) % N;

    cDrag = 0; VEL_BUF = [];
    cApply(cards, false);
    cBounceIndicator();
  }

  stage.addEventListener('touchstart',  function(e){ onStart(e.touches[0].clientX); }, { passive: true });
  stage.addEventListener('touchmove',   function(e){ onMove(e.touches[0].clientX);  }, { passive: true });
  stage.addEventListener('touchend',    onEnd);
  stage.addEventListener('touchcancel', onEnd);
  stage.addEventListener('mousedown',   function(e){ onStart(e.clientX); e.preventDefault(); });
  document.addEventListener('mousemove', function(e){ if (cDragging) onMove(e.clientX); });
  document.addEventListener('mouseup',   onEnd);
}

// ─────────────────────────────────────────────
//  Marquee DOM 셋업
//  — pill 디자인 변경 없음
//  — .timer-ic-text 를 2벌 복제해 .timer-marquee-track 으로 감쌈
//  — 두 아이템에 동일한 paddingRight 를 줘서 translateX(-50%) 가
//    정확히 1벌 너비만큼 이동 → 끊김 없는 루프 보장
// ─────────────────────────────────────────────
(function () {
  var pill   = document.querySelector('.timer-pill');
  var icText = pill.querySelector('.timer-ic-text');
  var clone  = icText.cloneNode(true);

  // 두 아이템이 동일 너비여야 -50% 가 정확히 반복 지점에 도달
  var spacer = '56px';
  icText.style.paddingRight = spacer;
  clone.style.paddingRight  = spacer;

  var track = document.createElement('div');
  track.className = 'timer-marquee-track';
  track.appendChild(icText);
  track.appendChild(clone);
  pill.appendChild(track);
})();
</script>
</body>
</html>
