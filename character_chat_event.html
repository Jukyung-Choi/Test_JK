<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, initial-scale=1.0">
<title>내 취향은 누구?!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Serif+KR:wght@700;900&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1e1e1e;
    font-family: 'SF Pro Text', -apple-system, 'Apple SD Gothic Neo', sans-serif;
    display: flex;
    justify-content: center;
  }

  .frame {
    position: relative;
    width: 390px;
    height: 844px;
    overflow: hidden;
    background: linear-gradient(to bottom, #000000 0%, #400e00 85%);
  }

  .abs { position: absolute; }

  /* ─── KV (flattened photographic key visual) ─── */
  .kv {
    position: absolute;
    top: -1px;
    left: 0;
    width: 390px;
    height: 844px;
    display: block;
  }

  /* ─── dim ─── */
  .dim {
    position: absolute;
    left: 0;
    top: 351px;
    width: 390px;
    height: 495px;
    background: linear-gradient(
      180deg,
      rgba(211, 110, 72, 0) 6.0604%,
      rgba(133, 60, 33, 0.19) 25.493%,
      rgba(59, 28, 16, 0.72) 43.162%,
      rgb(0, 0, 0) 63.454%
    );
  }

  /* ─── btn ─── */
  .btn {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    top: 734px;
    width: 358px;
    height: 58px;
    padding: 18px 24px;
    border-radius: 8.32px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .btn p {
    flex: 1 0 0;
    min-width: 0;
    font-weight: 700;
    font-size: 18px;
    line-height: normal;
    color: #999;
    text-align: center;
    word-break: break-word;
    cursor: pointer;
    will-change: opacity;
    animation: startBlink 1.4s ease-in-out infinite;
  }
  @keyframes startBlink {
    0%, 100% { opacity: 0.45; }
    50%      { opacity: 1; }
  }

  /* ─── title ─── */
  .title {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: 233px;
    width: 342px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    gap: 12px;
    text-align: center;
    word-break: break-word;
  }
  .title-main {
    width: 100%;
    font-family: "Nanum Myeongjo", "Noto Serif KR", "Pretendard", "Apple SD Gothic Neo", sans-serif;
    font-weight: 800;
    font-size: clamp(38px, 11vw, 42px);
    line-height: 1.1;
    letter-spacing: -0.03em;
    white-space: nowrap;
    color: #fffaf0;
    -webkit-text-stroke: 1px rgba(255, 128, 28, 0.9);
    text-shadow:
      0 0 4px rgba(255, 255, 255, 0.9),
      0 0 8px rgba(255, 122, 22, 0.95),
      0 0 16px rgba(255, 92, 0, 0.75),
      0 4px 8px rgba(120, 45, 0, 0.65);
  }
  .title-sub {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
    font-size: 17px;
    line-height: 22px;
    color: #ffffff;
    text-shadow: 0px 0px 1.04px #81dbff;
  }
  .title-sub p { width: 100%; }
  .title-sub .bold { font-weight: 700; }
  .title-sub .regular { font-weight: 400; }

  /* ─── progress ─── */
  .progress-wrap {
    position: absolute;
    left: 0;
    bottom: 125px;
    width: 390px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    gap: 20.8px;
  }
  .progress {
    position: relative;
    width: 100%;
    height: 81px;
  }
  .progress-bg {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    top: 39px;
    width: 342px;
    height: 24px;
    background: #800032;
    border-radius: 104px;
  }
  .progress-fill {
    position: absolute;
    left: calc(50% - 106px);
    transform: translateX(-50%);
    top: 39px;
    width: 130px;
    height: 24px;
    background: linear-gradient(90deg, #ff1601, #fb5801);
    border-radius: 104px;
  }
  .num {
    position: absolute;
    left: 24px;
    top: 39px;
    width: 342px;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .num-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    width: 24px;
    height: 42px;
  }
  .num-item.hidden { opacity: 0; }
  .dot-box {
    position: relative;
    width: 100%;
    height: 24px;
  }
  .dot {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #ffffff;
  }
  .dot.end { background: #fc7201; }
  .num-label {
    font-weight: 700;
    font-size: 11.44px;
    line-height: 16.64px;
    color: #ffffff;
    text-align: center;
    white-space: nowrap;
  }

  /* ─── bubbles ─── */
  .bubble-right {
    position: absolute;
    left: 290px;
    top: 0;
    width: 84px;
    height: 34px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    justify-content: flex-start;
  }
  .bubble-center {
    position: absolute;
    left: 98px;
    top: 0;
    width: 91px;
    height: 33px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    justify-content: flex-start;
  }
  .bubble {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    height: 29px;
    padding: 10px;
    border-radius: 39.52px;
  }
  .bubble.white { background: #ffffff; }
  .bubble.maroon { background: #800032; width: 91px; }
  .bubble-text {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .bubble-text img,
  .bubble-text svg { width: 15px; height: 15px; display: block; }
  .bubble-text p { font-weight: 700; font-size: 15px; line-height: normal; white-space: nowrap; }
  .bubble.white .bubble-text p { color: #292930; }
  .bubble.maroon .bubble-text { height: 17px; }
  .bubble.maroon .bubble-text img,
  .bubble.maroon .bubble-text p { opacity: 0.5; }
  .bubble.maroon .bubble-text p { color: #ffffff; }

  .tail {
    position: absolute;
    top: 29px;
    width: 8.32px;
    height: 5.2px;
    display: block;
  }
  .tail.right { left: calc(50% + 23px); transform: translateX(-50%); }
  .tail.center { left: calc(50% + 0.5px); transform: translateX(-50%); }

  /* ─── home indicator ─── */
  .home-indicator {
    position: absolute;
    left: 0;
    bottom: -0.48px;
    width: 390px;
    height: 35.36px;
  }
  .home-bar {
    position: absolute;
    left: calc(50% + 0.52px);
    transform: translateX(-50%);
    bottom: 9.36px;
    width: 139.36px;
    height: 5.2px;
    background: #000000;
    border-radius: 100px;
  }

  /* ─── TOP_인앱 ─── */
  .top {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    background: #0a0201;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }
  .status-bar {
    position: relative;
    width: 390px;
    height: 45.76px;
    flex-shrink: 0;
  }
  .status-bar .time {
    position: absolute;
    left: 49.92px;
    transform: translateX(-50%);
    top: calc(50% - 7.97px);
    width: 56.16px;
    font-weight: 600;
    font-size: 15.6px;
    line-height: normal;
    letter-spacing: -0.3px;
    color: #ffffff;
    text-align: center;
    white-space: nowrap;
  }
  .status-bar .battery {
    position: absolute;
    right: 14.91px;
    top: 18.03px;
    width: 25.301px;
    height: 11.787px;
    display: block;
  }
  .status-bar .wifi {
    position: absolute;
    right: 47.23px;
    top: 18.03px;
    width: 15.946px;
    height: 11.44px;
    display: block;
  }
  .status-bar .cellular {
    position: absolute;
    right: 69.22px;
    top: 18.37px;
    width: 17.68px;
    height: 11.10px;
    display: block;
  }
  .title-bar {
    position: relative;
    width: 390px;
    height: 54.08px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16.64px;
  }
  .icon-placeholder { width: 24.96px; height: 24.96px; opacity: 0; flex-shrink: 0; }
  .timer-pill {
    display: flex;
    align-items: center;
    gap: 20.8px;
    height: 29.12px;
    width: 239.2px;
    padding-left: 8.32px;
    background: rgba(154, 154, 154, 0.5);
    border-radius: 100px;
    overflow: hidden;
    flex-shrink: 0;
  }
  .timer-ic-text {
    display: flex;
    align-items: center;
    width: max-content;
    will-change: transform;
    animation: timerTextFlow 12s linear infinite;
  }
  .timer-item {
    display: flex;
    align-items: center;
    gap: 4.16px;
    flex-shrink: 0;
    padding-right: 32px;
  }
  .timer-item .clock {
    width: 14.56px;
    height: 14.56px;
    opacity: 0.8;
    display: block;
    flex-shrink: 0;
  }
  .timer-item p {
    font-weight: 500;
    font-size: 11.44px;
    line-height: 16.64px;
    color: #ffffff;
    opacity: 0.8;
    white-space: nowrap;
  }
  @keyframes timerTextFlow {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }

  @media (prefers-reduced-motion: reduce) {
    .timer-ic-text,
    .btn p {
      animation: none;
      transform: none;
    }
  }

  /* ════════════════ SCREEN 2 : 캐릭터 선택 ════════════════ */
  #screen2 {
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, #000000 0%, #400e00 85%);
    opacity: 0;
    visibility: hidden;
    z-index: 50;
    transition: opacity 350ms ease-out, visibility 0s linear 350ms;
  }
  #screen2.active {
    opacity: 1;
    visibility: visible;
    transition: opacity 350ms ease-out;
  }
  .s2-rise {
    position: absolute;
    inset: 0;
    transform: translateY(20px);
    transition: transform 350ms ease-out;
    will-change: transform;
  }
  #screen2.active .s2-rise { transform: translateY(0); }

  #screen2 .top { z-index: 30; }
  .close-x {
    width: 24.96px;
    height: 24.96px;
    flex-shrink: 0;
    display: block;
    cursor: pointer;
  }

  .title2 {
    position: absolute;
    left: calc(50% + 0.5px);
    transform: translateX(-50%);
    top: 140px;
    width: 342px;
    text-align: center;
  }
  .title2 p {
    width: 100%;
    font-weight: 700;
    font-size: 25px;
    line-height: normal;
    color: #ffffff;
    text-align: center;
    text-transform: capitalize;
    word-break: break-word;
  }

  .sellect {
    position: absolute;
    left: calc(50% + 0.5px);
    transform: translateX(-50%);
    top: 224px;
    width: 30px;
    height: 22px;
    z-index: 20;
  }
  .sellect img {
    display: block;
    width: 30px;
    height: 22px;
    will-change: transform;
  }
  .sellect img.bounce {
    animation: triBounce 0.52s ease-in-out;
  }
  @keyframes triBounce {
    0%   { transform: translateY(0); }
    30%  { transform: translateY(-7px); }
    60%  { transform: translateY(0); }
    80%  { transform: translateY(-6px); }
    100% { transform: translateY(0); }
  }

  .carousel {
    position: absolute;
    top: 257px;
    left: 0;
    width: 390px;
    height: 404px;
    z-index: 10;
    touch-action: none;
  }
  .cchar-card {
    position: absolute;
    top: 0;
    left: 50%;
    width: 262px;
    height: 404px;
    opacity: 0.65;
    will-change: transform, opacity;
  }
  .cchar-card.animating {
    transition: transform 430ms cubic-bezier(0.34, 1.3, 0.64, 1), opacity 300ms ease-out;
  }
  .cchar-scale {
    width: 100%;
    height: 100%;
    transform: scale(0.9);
    transform-origin: center center;
    will-change: transform;
  }
  .cchar-card.animating .cchar-scale {
    transition: transform 430ms cubic-bezier(0.34, 1.3, 0.64, 1);
  }

    height: 404px;
    transform-origin: center center;

  .cchar-pulse.pulse { animation: cardPulse 200ms ease-out; }

    0%   { transform: scale(1); }
    50%  { transform: scale(1.03); }
    100% { transform: scale(1); }
  }

  .btn2 {
    position: absolute;
    left: 50%;
    top: 734px;
    transform: translateX(-50%);
    width: 358px;
    height: 58px;
    padding: 18px 24px;
    border-radius: 8.32px;
    background: #fc5001;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    cursor: pointer;
    z-index: 20;
    transition: transform 120ms ease-out;
    will-change: transform;
  }
  .btn2:active { transform: translateX(-50%) scale(0.98); }
  .btn2 p {
    flex: 1 0 0;
    min-width: 0;
    font-weight: 700;
    font-size: 18px;
    line-height: normal;
    color: #ffffff;
    text-align: center;
    word-break: break-word;
    position: relative;
    z-index: 1;
  }
  .btn2 .shine {
    position: absolute;
    top: -20%;
    left: 0;
    width: 38%;
    height: 140%;
    background: linear-gradient(100deg, transparent 0%, rgba(255, 255, 255, 0.45) 50%, transparent 100%);
    transform: translateX(-220%) skewX(-18deg);
    pointer-events: none;
    animation: btnShine 3.5s ease-in-out infinite;
    will-change: transform;
  }
  @keyframes btnShine {
    0%   { transform: translateX(-220%) skewX(-18deg); }
    86%  { transform: translateX(380%)  skewX(-18deg); }
    100% { transform: translateX(380%)  skewX(-18deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .sellect img,
    .cchar-pulse.pulse { animation: none; }
    .btn2 .shine { display: none; }
    .s2-rise { transition: none; }
    .cchar-card.animating,
    .cchar-card.animating .cchar-scale {
      transition: transform 240ms ease-out, opacity 240ms ease-out;
    }
  }
</style>

<script>
(function () {
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var screen2  = document.getElementById('screen2');
  var startBtn = document.querySelector('.btn');        /* 터치해서 시작 */
  var closeX   = screen2.querySelector('.close-x');
  var carousel = document.getElementById('carousel');
  var cards    = Array.prototype.slice.call(carousel.querySelectorAll('.cchar-card'));
  var scales   = cards.map(function (c) { return c.querySelector('.cchar-scale'); });
  var triImg   = screen2.querySelector('.sellect img');

  var STEP = 278.5;
  var index = Math.floor(cards.length / 2);
  var dragging = false, startPos = 0, dragOffset = 0,
      lastPos = 0, lastT = 0, velocity = 0, activeId = null;

  function applyCard(i, x) {
    var t = Math.min(Math.abs(x) / STEP, 1);
    cards[i].style.transform = 'translateX(calc(-50% + ' + x + 'px))';
    cards[i].style.opacity   = (1 - 0.35 * t).toFixed(3);
    cards[i].style.zIndex    = String(100 - Math.round(Math.abs(x) / STEP));
    scales[i].style.transform = 'scale(' + (1 - 0.1 * t).toFixed(3) + ')';
  }
  function render(off) {
    for (var i = 0; i < cards.length; i++) applyCard(i, (i - index) * STEP + off);
  }
  function setAnimating(on) {
    for (var i = 0; i < cards.length; i++) cards[i].classList.toggle('animating', on);
  }
  function pulseCenter() {
    if (reduce) return;
    var inner = cards[index].querySelector('.cchar-pulse');
    inner.classList.remove('pulse');
    void inner.offsetWidth;
    inner.classList.add('pulse');
  }
  function bounceTri() {
    if (reduce) return;
    triImg.classList.remove('bounce');
    void triImg.offsetWidth;
    triImg.classList.add('bounce');
  }

  /* initial layout */
  setAnimating(false);
  render(0);

  /* drag / swipe */
  carousel.addEventListener('pointerdown', function (e) {
    dragging = true; activeId = e.pointerId;
    startPos = e.clientX; dragOffset = 0;
    lastPos = e.clientX; lastT = e.timeStamp; velocity = 0;
    setAnimating(false);
    carousel.setPointerCapture(e.pointerId);
  });
  carousel.addEventListener('pointermove', function (e) {
    if (!dragging || e.pointerId !== activeId) return;
    dragOffset = e.clientX - startPos;
    var dt = e.timeStamp - lastT;
    if (dt > 0) { velocity = (e.clientX - lastPos) / dt; lastPos = e.clientX; lastT = e.timeStamp; }
    render(dragOffset);
  });
  function endDrag(e) {
    if (!dragging) return;
    dragging = false;
    var target = index;
    var threshold = STEP * 0.32;
    if (dragOffset <= -threshold || velocity < -0.5) target = index + 1;
    else if (dragOffset >= threshold || velocity > 0.5) target = index - 1;
    if (target < 0) target = 0;
    if (target > cards.length - 1) target = cards.length - 1;
    var changed = target !== index;
    index = target;
    setAnimating(true);
    render(0);
    if (changed) { setTimeout(pulseCenter, 170); bounceTri(); }
  }
  carousel.addEventListener('pointerup', endDrag);
  carousel.addEventListener('pointercancel', endDrag);

  /* screen transition */
  if (startBtn) startBtn.addEventListener('click', function () {
    screen2.classList.add('active');
    setAnimating(false);
    render(0);
  });
  if (closeX) closeX.addEventListener('click', function () {
    screen2.classList.remove('active');
  });
})();
</script>
