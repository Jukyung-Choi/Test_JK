<script>
// ─── 상태값 ───
const progressState = 3;

const TOTAL_STEPS = 7, TRACK_WIDTH = 328, DOT_SIZE = 22;
const GAP = (TRACK_WIDTH - TOTAL_STEPS * DOT_SIZE) / (TOTAL_STEPS - 1);
const TRACK_LEFT = 24;

function calcFillWidth(state) {
  return state * (DOT_SIZE + GAP) - GAP;
}

function applyProgressState(state) {
  var w = calcFillWidth(state);
  document.querySelectorAll('.progress-fill').forEach(function(fill) {
    fill.style.left = TRACK_LEFT + 'px';
    fill.style.transform = 'none';
    fill.style.width = w + 'px';
  });
  document.querySelectorAll('[data-reward-step]').forEach(function(bubble) {
    var step    = parseInt(bubble.dataset.rewardStep, 10);
    var inner   = bubble.querySelector('.bubble-inner');
    var text    = bubble.querySelector('.bubble-text');
    var tailImg = bubble.querySelector('.tail-img');
    var isActive = step <= state;
    inner.classList.toggle('active',        isActive);
    inner.classList.toggle('inactive',     !isActive);
    text.classList.toggle('active-text',    isActive);
    text.classList.toggle('inactive-text', !isActive);
    if (tailImg) tailImg.src = isActive ? bubble.dataset.tailActive : bubble.dataset.tailInactive;
  });
}

applyProgressState(progressState);

// ─── Screen toggle ───
var tooltip   = document.querySelector('#screen2 .s2c-tooltip');
var titleWrap = document.querySelector('#screen2 .s2c-title-wrap');

function showScreen2() {
  // 초기화
  tooltip.classList.remove('s2c-show');
  titleWrap.classList.remove('s2c-show');
  document.getElementById('screen1').style.display = 'none';
  document.getElementById('screen2').style.display = 'block';
  // 툴팁 먼저
  requestAnimationFrame(function() {
    requestAnimationFrame(function() {
      tooltip.classList.add('s2c-show');
      // 툴팁 애니 도중 텍스트 겹쳐서 등장
      setTimeout(function() {
        titleWrap.classList.add('s2c-show');
      }, 180);
    });
  });
}

document.querySelector('#screen1 .btn').addEventListener('click', showScreen2);
document.getElementById('s2c-xbtn').addEventListener('click', function() {
  document.getElementById('screen2').style.display = 'none';
  tooltip.classList.remove('s2c-show');
  titleWrap.classList.remove('s2c-show');
  document.getElementById('screen1').style.display = 'block';
});

// "캐릭터 챗 홈으로 가기" → screen5
document.getElementById('s2c-cta').addEventListener('click', function() {
  document.getElementById('screen2').style.display = 'none';
  document.getElementById('screen5').style.display = 'block';
});

// screen5 터치 → screen1
document.getElementById('screen5').addEventListener('click', function() {
  document.getElementById('screen5').style.display = 'none';
  tooltip.classList.remove('s2c-show');
  titleWrap.classList.remove('s2c-show');
  document.getElementById('screen1').style.display = 'block';
});

// ─── Marquee (모든 timer-pill 처리) ───
(function() {
  document.querySelectorAll('.timer-pill').forEach(function(pill) {
    var icText = pill.querySelector('.timer-ic-text');
    var clone  = icText.cloneNode(true);
    icText.style.paddingRight = '56px';
    clone.style.paddingRight  = '56px';
    var track = document.createElement('div');
    track.className = 'timer-marquee-track';
    track.appendChild(icText);
    track.appendChild(clone);
    pill.appendChild(track);
  });
})();
</script>
