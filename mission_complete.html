<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모든 미션 완료!</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    background: #1a1a2e;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, 'SF Pro Text', 'SF Pro', 'Apple SD Gothic Neo', sans-serif;
  }

  /* ── 390×844 Phone shell (matches Figma frame) ── */
  .phone {
    width: 390px;
    height: 844px;
    background: linear-gradient(to bottom, #000000 0%, #400e00 85%);
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
    color: #ffffff;

    /* ── 화면 등장 : fade-in + rise ── */
    opacity: 0;
    transform: translateY(12px);
    animation: screen-in 350ms ease-out forwards;
    will-change: opacity, transform;
  }
  @keyframes screen-in {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── TOP_인앱 : status bar + title (fixed overlay) ── */
  .topbar {
    position: absolute;
    top: 0; left: 0;
    width: 390px;
    height: 100px;
    background: #0a0201;
    z-index: 20;
  }
  .status-bar { position: relative; height: 45.76px; }
  .sb-time {
    position: absolute;
    left: 21.84px; top: 14.9px;
    width: 56.16px;
    text-align: center;
    font-size: 15.6px;
    font-weight: 600;
    letter-spacing: -0.3px;
  }
  .sb-battery  { position: absolute; right: 14.91px; top: 18.03px; width: 25.301px; height: 11.787px; }
  .sb-wifi     { position: absolute; right: 47.23px;  top: 18.03px; width: 15.946px; height: 11.44px; }
  .sb-cellular { position: absolute; right: 69.22px;  top: 18.03px; width: 17.68px;  height: 11.094px; }
  .sb-battery svg, .sb-wifi svg, .sb-cellular svg { display: block; width: 100%; height: 100%; }

  .titlebar {
    height: 54.08px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16.64px;
  }
  .close-btn { width: 24.96px; height: 24.96px; position: relative; cursor: pointer; }
  .close-btn::before, .close-btn::after {
    content: ''; position: absolute;
    top: 50%; left: 50%;
    width: 16px; height: 1.6px;
    background: #ffffff; border-radius: 2px;
  }
  .close-btn::before { transform: translate(-50%,-50%) rotate(45deg); }
  .close-btn::after  { transform: translate(-50%,-50%) rotate(-45deg); }
  .titlebar .spacer { width: 24.96px; height: 24.96px; opacity: 0; }

  /* ── Header : icon + title (fixed) ── */
  .header {
    position: absolute;
    top: 102px;
    left: 24.5px;
    width: 342px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .ic-complete {
    width: 70px;
    height: 72.561px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .badge {
    position: relative;
    width: 64px;
    height: 65.278px;
    /* confine the gloss sweep to the scalloped badge silhouette */
    -webkit-mask-image: var(--badge);
            mask-image: var(--badge);
    -webkit-mask-size: contain;         mask-size: contain;
    -webkit-mask-repeat: no-repeat;     mask-repeat: no-repeat;
    -webkit-mask-position: center;      mask-position: center;
  }
  .badge img {
    display: block;
    width: 100%; height: 100%;
    object-fit: contain;
  }
  /* Gloss Shine — one diagonal light pass, then rest */
  .badge .shine {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      110deg,
      transparent 0%,
      rgba(255,255,255,0.0) 35%,
      rgba(255,255,255,0.75) 50%,
      rgba(255,255,255,0.0) 65%,
      transparent 100%
    );
    transform: translateX(-100%);
    will-change: transform;
    pointer-events: none;
    /* 3.0s idle + 0.9s pass = 3.9s cycle */
    animation: badge-shine 3900ms linear infinite;
  }
  @keyframes badge-shine {
    0%     { transform: translateX(-100%); }
    76.9%  { transform: translateX(-100%); }
    100%   { transform: translateX(100%);  }
  }

  .title {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8.32px;
    width: 100%;
    text-align: center;
    color: #ffffff;
  }
  .hero-title {
    font-family: 'SF Pro', -apple-system, 'Apple SD Gothic Neo', sans-serif;
    font-size: 36px;
    font-weight: 700;
    line-height: normal;
    width: 100%;
  }
  .hero-sub {
    font-family: 'SF Pro Text', -apple-system, 'Apple SD Gothic Neo', sans-serif;
    font-size: 15px;
    font-weight: 500;
    line-height: normal;
    width: 100%;
  }

  /* ── Card list (scroll area) ── */
  .list {
    position: absolute;
    top: 299px;
    left: 24.5px;
    width: 342px;
    bottom: 0;
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: none;
  }
  .list::-webkit-scrollbar { display: none; }

  .card-grid {
    display: grid;
    grid-template-columns: repeat(2, 165px);
    gap: 12px;
    padding-bottom: 47px;
  }
  .card {
    width: 165px;
    height: 193px;
    border-radius: 10px;
    overflow: hidden;
    position: relative;
  }
  .card-img {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    pointer-events: none;
  }
  .card-dim {
    position: absolute;
    left: 0; top: 121px;
    width: 165px; height: 72px;
    background: linear-gradient(to bottom, rgba(0,0,0,0), rgba(0,0,0,0.6));
  }
  .card-label {
    position: absolute;
    bottom: 10px; left: 50%;
    transform: translateX(-50%);
    width: 143.52px;
    text-align: center;
    font-family: 'SF Pro Text', -apple-system, 'Apple SD Gothic Neo', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: #ffffff;
    word-break: break-word;
  }

  /* ── Home Indicator ── */
  .home-indicator {
    position: absolute;
    bottom: 0; left: 0.5px;
    width: 390px; height: 35px;
    z-index: 20;
  }
  .home-bar {
    position: absolute;
    bottom: 9.36px; left: 50%;
    transform: translateX(-50%);
    width: 139.36px; height: 5.2px;
    background: #000000;
    border-radius: 100px;
  }

  /* ── 진입 축하 confetti (1회 재생) ── */
  .confetti-overlay {
    position: absolute;
    inset: 0;
    z-index: 40;            /* 최상단 오버레이 */
    pointer-events: none;
    overflow: hidden;
    will-change: opacity;
  }
  .confetti-overlay img {
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }

  /* ── 접근성 : reduce motion ── */
  @media (prefers-reduced-motion: reduce) {
    .phone { animation: none; opacity: 1; transform: none; }
    .badge .shine { display: none; animation: none; }
    .confetti-overlay { display: none; }
  }

  (function () {
    var overlay = document.getElementById('confettiOverlay');
    if (!overlay) return;
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    var PLAY_MS = 1890;
    setTimeout(function () {
      overlay.style.transition = 'opacity 450ms ease-out';
      overlay.style.opacity = '0';
      setTimeout(function () { overlay.remove(); }, 500);
