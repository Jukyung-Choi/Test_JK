<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1.0">
<title>모든 미션 완료!</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #010101;
    font-family: -apple-system, 'Apple SD Gothic Neo', sans-serif;
    width: 375px;
    min-height: 812px;
    position: relative;
    overflow-x: hidden;
    color: white;
  }

  /* ─── Canvas for confetti ─── */
  #confetti-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 375px; height: 100%;
    pointer-events: none;
    z-index: 100;
  }

  /* ─── Status Bar ─── */
  .status-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px 0;
    height: 44px;
  }
  .status-time { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; }
  .status-icons { display: flex; gap: 6px; align-items: center; font-size: 12px; }

  /* ─── Nav ─── */
  .nav {
    height: 52px;
    display: flex;
    align-items: center;
    padding: 0 16px;
  }
  .close-btn {
    width: 24px; height: 24px;
    cursor: pointer;
    position: relative;
  }
  .close-btn::before,
  .close-btn::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 14px; height: 1.5px;
    background: white;
    border-radius: 2px;
  }
  .close-btn::before { transform: translate(-50%, -50%) rotate(45deg); }
  .close-btn::after  { transform: translate(-50%, -50%) rotate(-45deg); }

  /* ─── Hero Area ─── */
  .hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px 18px 32px;
    gap: 12px;
    position: relative;
  }

  /* Trophy badge */
  .trophy-wrap {
    position: relative;
    width: 96px; height: 96px;
    display: flex; align-items: center; justify-content: center;
    opacity: 0;
    animation: trophyIn 0.7s cubic-bezier(0.34,1.56,0.64,1) 0.2s forwards;
  }
  @keyframes trophyIn {
    from { opacity: 0; transform: scale(0.3) rotate(-15deg); }
    to   { opacity: 1; transform: scale(1) rotate(0deg); }
  }

  .trophy-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid rgba(251,104,0,0.4);
    animation: ringPulse 2s ease-in-out 1s infinite;
  }
  .trophy-ring.ring2 {
    inset: -8px;
    border-color: rgba(251,104,0,0.2);
    animation-delay: 1.3s;
  }
  @keyframes ringPulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.12); opacity: 0.4; }
  }

  .trophy-circle {
    width: 80px; height: 80px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ff9a3c, #fb6800 60%, #c44d00);
    display: flex; align-items: center; justify-content: center;
    font-size: 38px;
    box-shadow:
      0 0 0 0 rgba(251,104,0,0.6),
      0 8px 32px rgba(251,104,0,0.5),
      0 2px 8px rgba(0,0,0,0.4);
    animation: trophyGlow 2s ease-in-out 1s infinite;
  }
  @keyframes trophyGlow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(251,104,0,0.6), 0 8px 32px rgba(251,104,0,0.5), 0 2px 8px rgba(0,0,0,0.4); }
    50%       { box-shadow: 0 0 0 10px rgba(251,104,0,0), 0 8px 48px rgba(251,104,0,0.8), 0 2px 8px rgba(0,0,0,0.4); }
  }

  /* Stamp / ALL CLEAR badge */
  .stamp {
    position: absolute;
    top: -4px; right: -4px;
    width: 28px; height: 28px;
    background: #22c55e;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid #010101;
    opacity: 0;
    animation: stampIn 0.4s cubic-bezier(0.34,1.56,0.64,1) 0.8s forwards;
  }
  @keyframes stampIn {
    from { opacity: 0; transform: scale(0); }
    to   { opacity: 1; transform: scale(1); }
  }
  .stamp svg { width: 14px; height: 14px; }

  /* Title */
  .title-wrap {
    text-align: center;
    opacity: 0;
    animation: fadeUp 0.6s ease 0.9s forwards;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .title-main {
    font-size: 32px;
    font-weight: 700;
    line-height: 1.25;
    background: linear-gradient(135deg, #ffffff 0%, #ffb347 50%, #fb6800 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 20px rgba(251,104,0,0.4));
    animation: titleShimmer 3s linear 1.5s infinite;
    background-size: 200% 100%;
  }
  @keyframes titleShimmer {
    0%   { background-position: 100% 0; }
    100% { background-position: -100% 0; }
  }

  .title-sub {
    font-size: 14px;
    font-weight: 500;
    color: rgba(255,255,255,0.6);
    margin-top: 6px;
    line-height: 20px;
  }

  /* Divider with stars */
  .divider {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    opacity: 0;
    animation: fadeUp 0.5s ease 1.1s forwards;
  }
  .divider-line { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, rgba(251,104,0,0.4), transparent); }
  .divider-text { font-size: 11px; color: rgba(251,104,0,0.7); letter-spacing: 2px; font-weight: 600; }

  /* ─── Card Grid ─── */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(2, 158px);
    gap: 14px;
    padding: 0 18px 120px;
    justify-content: center;
  }

  .card {
    width: 158px; height: 186px;
    border-radius: 10px;
    overflow: hidden;
    position: relative;
    opacity: 0;
    transform: translateY(24px) scale(0.95);
    /* stagger set by JS */
  }
  .card.visible {
    animation: cardIn 0.5s cubic-bezier(0.34,1.2,0.64,1) forwards;
  }
  @keyframes cardIn {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .card-img {
    width: 100%; height: 212px;
    object-fit: cover;
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
  }
  .card-dim {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 72px;
    background: linear-gradient(to bottom, rgba(124,124,124,0), #7c7c7c);
  }
  .card-label {
    position: absolute;
    bottom: 10px; left: 0; right: 0;
    text-align: center;
    font-size: 12px;
    color: white;
    padding: 0 10px;
  }

  /* Completed overlay on cards */
  .card-complete {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: flex; align-items: center; justify-content: center;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .card:hover .card-complete { opacity: 1; }
  .card-check {
    width: 40px; height: 40px;
    background: rgba(34,197,94,0.9);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }

  /* ─── Floating Button ─── */
  .btn-wrap {
    position: fixed;
    bottom: 0; left: 0;
    width: 375px;
    background: linear-gradient(to top, #000 60%, transparent);
    padding: 14px 16px 16px;
    z-index: 50;
  }

  .btn-draw {
    width: 100%;
    padding: 17px 16px;
    background: #fb6800;
    border: none;
    border-radius: 12px;
    font-size: 17px;
    font-weight: 600;
    color: white;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    opacity: 0;
    animation: fadeUp 0.5s ease 1.4s forwards;
  }
  .btn-draw::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 60%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
    animation: btnShine 2.5s ease 2s infinite;
  }
  @keyframes btnShine {
    0%   { left: -60%; }
    100% { left: 160%; }
  }
  .btn-draw:active { transform: scale(0.98); background: #e05a00; }

  /* Home indicator */
  .home-indicator {
    height: 34px;
    display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: 9px;
    background: #000;
    position: fixed;
    bottom: 0; left: 0; width: 375px;
  }
  .home-bar {
    width: 134px; height: 5px;
    background: rgba(255,255,255,0.3);
    border-radius: 100px;
  }
</style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<!-- Status Bar -->
<div class="status-bar">
  <span class="status-time">9:41</span>
  <div class="status-icons">
    <svg width="17" height="12" viewBox="0 0 17 12" fill="none">
      <rect x="0" y="3" width="3" height="9" rx="1" fill="white" opacity="0.4"/>
      <rect x="4.5" y="2" width="3" height="10" rx="1" fill="white" opacity="0.6"/>
      <rect x="9" y="0" width="3" height="12" rx="1" fill="white" opacity="0.8"/>
      <rect x="13.5" y="0" width="3" height="12" rx="1" fill="white"/>
    </svg>
    <svg width="16" height="12" viewBox="0 0 16 12" fill="white">
      <path d="M8 2.4C10.3 2.4 12.4 3.4 13.8 5L15.3 3.5C13.5 1.3 10.9 0 8 0C5.1 0 2.5 1.3 0.7 3.5L2.2 5C3.6 3.4 5.7 2.4 8 2.4Z" opacity="0.4"/>
      <path d="M8 4.8C9.7 4.8 11.2 5.5 12.3 6.7L13.8 5.2C12.3 3.6 10.3 2.6 8 2.6C5.7 2.6 3.7 3.6 2.2 5.2L3.7 6.7C4.8 5.5 6.3 4.8 8 4.8Z" opacity="0.7"/>
      <path d="M8 7.2C9.1 7.2 10.1 7.7 10.8 8.4L8 12L5.2 8.4C5.9 7.7 6.9 7.2 8 7.2Z"/>
    </svg>
    <svg width="25" height="12" viewBox="0 0 25 12" fill="none">
      <rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="white" stroke-opacity="0.35"/>
      <rect x="2" y="2" width="17" height="8" rx="2" fill="white"/>
      <path d="M23 4.5V7.5C23.8 7.2 24.5 6.7 24.5 6C24.5 5.3 23.8 4.8 23 4.5Z" fill="white" opacity="0.4"/>
    </svg>
  </div>
</div>

<!-- Nav -->
<div class="nav">
  <div class="close-btn"></div>
</div>

<!-- Hero -->
<div class="hero">
  <div class="trophy-wrap">
    <div class="trophy-ring ring2"></div>
    <div class="trophy-ring"></div>
    <div class="trophy-circle">🏆</div>
    <div class="stamp">
      <svg viewBox="0 0 14 14" fill="none">
        <path d="M2.5 7L5.5 10L11.5 4" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>

  <div class="title-wrap">
    <div class="title-main">모든 미션 완료!</div>
    <div class="title-sub">다른 캐릭터도 만나러 가볼까요?</div>
  </div>

  <div class="divider">
    <div class="divider-line"></div>
    <div class="divider-text">ALL CLEAR</div>
    <div class="divider-line"></div>
  </div>
</div>

<!-- Card Grid -->
<div class="card-grid" id="cardGrid">
  <!-- 8 cards injected by JS -->
</div>

<!-- Floating Button -->
<div class="btn-wrap" style="padding-bottom: 50px;">
  <button class="btn-draw">지금 바로 뽑기</button>
</div>

<!-- Home Indicator -->
<div class="home-indicator" style="position:static; margin-top: 0;">
  <div class="home-bar"></div>
</div>

<script>
// ─── Confetti ────────────────────────────────────────────────
const canvas = document.getElementById('confetti-canvas');
const ctx = canvas.getContext('2d');
canvas.width = 375;
canvas.height = window.innerHeight;

const COLORS = ['#fb6800','#ff9a3c','#ffffff','#ffb347','#22c55e','#ffd700'];
const particles = [];

function makeParticle() {
  return {
    x: Math.random() * 375,
    y: -10,
    vx: (Math.random() - 0.5) * 2,
    vy: Math.random() * 3 + 1.5,
    size: Math.random() * 6 + 3,
    color: COLORS[Math.floor(Math.random() * COLORS.length)],
    angle: Math.random() * Math.PI * 2,
    spin: (Math.random() - 0.5) * 0.2,
    shape: Math.random() > 0.5 ? 'rect' : 'circle',
    opacity: 1,
    life: 0,
    maxLife: Math.random() * 120 + 80,
  };
}

let burst = true;
let burstCount = 0;

function animateConfetti() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (burst && burstCount < 80) {
    particles.push(makeParticle());
    particles[particles.length - 1].vy = Math.random() * 5 + 2;
    particles[particles.length - 1].vx = (Math.random() - 0.5) * 4;
    burstCount++;
  } else {
    burst = false;
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.05; // gravity
    p.angle += p.spin;
    p.life++;
    p.opacity = Math.max(0, 1 - p.life / p.maxLife);

    ctx.save();
    ctx.globalAlpha = p.opacity;
    ctx.translate(p.x, p.y);
    ctx.rotate(p.angle);
    ctx.fillStyle = p.color;

    if (p.shape === 'rect') {
      ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
    } else {
      ctx.beginPath();
      ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    if (p.life >= p.maxLife || p.y > canvas.height + 20) {
      particles.splice(i, 1);
    }
  }

  if (particles.length > 0 || burst) {
    requestAnimationFrame(animateConfetti);
  }
}
animateConfetti();

// ─── Card Grid ───────────────────────────────────────────────
const IMG = 'https://www.figma.com/api/mcp/asset/cb78bdf0-577c-4202-80e9-8001c383be11';
const grid = document.getElementById('cardGrid');

for (let i = 0; i < 8; i++) {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <img class="card-img" src="${IMG}" alt="">
    <div class="card-dim"></div>
    <div class="card-label">당신만 바라보는 남사친</div>
    <div class="card-complete">
      <div class="card-check">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M4 10L8 14L16 6" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>
  `;
  grid.appendChild(card);
}

// Stagger card animation on scroll / init
const cards = document.querySelectorAll('.card');
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      const idx = [...cards].indexOf(entry.target);
      entry.target.style.animationDelay = `${1.5 + idx * 0.08}s`;
      entry.target.classList.add('visible');
      observer.unobserve(entry.target);
    }
  });
}, { threshold: 0.1 });

cards.forEach(c => observer.observe(c));
</script>
</body>
</html>
