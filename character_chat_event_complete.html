<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, initial-scale=1.0">
<title>내 취향은 누구?!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Serif+KR:wght@700;900&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1e1e1e;
    font-family: 'SF Pro Text', -apple-system, 'Apple SD Gothic Neo', sans-serif;
    display: flex;
    justify-content: center;
  }

  .frame {
    position: relative;
    width: 390px;
    height: 844px;
    overflow: hidden;
    background: linear-gradient(to bottom, #000000 0%, #400e00 85%);
  }

  .abs { position: absolute; }

  /* ─── KV (flattened photographic key visual) ─── */
  .kv {
    position: absolute;
    top: -1px;
    left: 0;
    width: 390px;
    height: 844px;
    display: block;
  }

  /* ─── dim ─── */
  .dim {
    position: absolute;
    left: 0;
    top: 351px;
    width: 390px;
    height: 495px;
    background: linear-gradient(
      180deg,
      rgba(211, 110, 72, 0) 6.0604%,
      rgba(133, 60, 33, 0.19) 25.493%,
      rgba(59, 28, 16, 0.72) 43.162%,
      rgb(0, 0, 0) 63.454%
    );
  }

  /* ─── btn ─── */
  .btn {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    top: 734px;
    width: 358px;
    height: 58px;
    padding: 18px 24px;
    border-radius: 8.32px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .btn p {
    flex: 1 0 0;
    min-width: 0;
    font-weight: 700;
    font-size: 18px;
    line-height: normal;
    color: #999;
    text-align: center;
    word-break: break-word;
    cursor: pointer;
    will-change: opacity;
    animation: startBlink 1.4s ease-in-out infinite;
  }
  @keyframes startBlink {
    0%, 100% { opacity: 0.45; }
    50%      { opacity: 1; }
  }

  /* ─── title ─── */
  .title {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: 233px;
    width: 342px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    gap: 12px;
    text-align: center;
    word-break: break-word;
  }
  .title-main {
    width: 100%;
    font-family: "Nanum Myeongjo", "Noto Serif KR", "Pretendard", "Apple SD Gothic Neo", sans-serif;
    font-weight: 800;
    font-size: clamp(38px, 11vw, 42px);
    line-height: 1.1;
    letter-spacing: -0.03em;
    white-space: nowrap;
    color: #fffaf0;
    -webkit-text-stroke: 1px rgba(255, 128, 28, 0.9);
    text-shadow:
      0 0 4px rgba(255, 255, 255, 0.9),
      0 0 8px rgba(255, 122, 22, 0.95),
      0 0 16px rgba(255, 92, 0, 0.75),
      0 4px 8px rgba(120, 45, 0, 0.65);
  }
  .title-sub {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
    font-size: 17px;
    line-height: 22px;
    color: #ffffff;
    text-shadow: 0px 0px 1.04px #81dbff;
  }
  .title-sub p { width: 100%; }
  .title-sub .bold { font-weight: 700; }
  .title-sub .regular { font-weight: 400; }

  /* ─── progress ─── */
  .progress-wrap {
    position: absolute;
    left: 0;
    bottom: 125px;
    width: 390px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    gap: 20.8px;
  }
  .progress {
    position: relative;
    width: 100%;
    height: 81px;
  }
  .progress-bg {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    top: 39px;
    width: 342px;
    height: 24px;
    background: #800032;
    border-radius: 104px;
  }
  .progress-fill {
    position: absolute;
    left: calc(50% - 106px);
    transform: translateX(-50%);
    top: 39px;
    width: 130px;
    height: 24px;
    background: linear-gradient(90deg, #ff1601, #fb5801);
    border-radius: 104px;
  }
  .num {
    position: absolute;
    left: 24px;
    top: 39px;
    width: 342px;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .num-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    width: 24px;
    height: 42px;
  }
  .num-item.hidden { opacity: 0; }
  .dot-box {
    position: relative;
    width: 100%;
    height: 24px;
  }
  .dot {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #ffffff;
  }
  .dot.end { background: #fc7201; }
  .num-label {
    font-weight: 700;
    font-size: 11.44px;
    line-height: 16.64px;
    color: #ffffff;
    text-align: center;
    white-space: nowrap;
  }

  /* ─── bubbles ─── */
  .bubble-right {
    position: absolute;
    left: 290px;
    top: 0;
    width: 84px;
    height: 34px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    justify-content: flex-start;
  }
  .bubble-center {
    position: absolute;
    left: 98px;
    top: 0;
    width: 91px;
    height: 33px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    justify-content: flex-start;
  }
  .bubble {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    height: 29px;
    padding: 10px;
    border-radius: 39.52px;
  }
  .bubble.white { background: #ffffff; }
  .bubble.maroon { background: #800032; width: 91px; }
  .bubble-text {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .bubble-text img,
  .bubble-text svg { width: 15px; height: 15px; display: block; }
  .bubble-text p { font-weight: 700; font-size: 15px; line-height: normal; white-space: nowrap; }
  .bubble.white .bubble-text p { color: #292930; }
  .bubble.maroon .bubble-text { height: 17px; }
  .bubble.maroon .bubble-text img,
  .bubble.maroon .bubble-text p { opacity: 0.5; }
  .bubble.maroon .bubble-text p { color: #ffffff; }

  .tail {
    position: absolute;
    top: 29px;
    width: 8.32px;
    height: 5.2px;
    display: block;
  }
  .tail.right { left: calc(50% + 23px); transform: translateX(-50%); }
  .tail.center { left: calc(50% + 0.5px); transform: translateX(-50%); }

  /* ─── home indicator ─── */
  .home-indicator {
    position: absolute;
    left: 0;
    bottom: -0.48px;
    width: 390px;
    height: 35.36px;
  }
  .home-bar {
    position: absolute;
    left: calc(50% + 0.52px);
    transform: translateX(-50%);
    bottom: 9.36px;
    width: 139.36px;
    height: 5.2px;
    background: #000000;
    border-radius: 100px;
  }

  /* ─── TOP_인앱 ─── */
  .top {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    background: #0a0201;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }
  .status-bar {
    position: relative;
    width: 390px;
    height: 45.76px;
    flex-shrink: 0;
  }
  .status-bar .time {
    position: absolute;
    left: 49.92px;
    transform: translateX(-50%);
    top: calc(50% - 7.97px);
    width: 56.16px;
    font-weight: 600;
    font-size: 15.6px;
    line-height: normal;
    letter-spacing: -0.3px;
    color: #ffffff;
    text-align: center;
    white-space: nowrap;
  }
  .status-bar .battery {
    position: absolute;
    right: 14.91px;
    top: 18.03px;
    width: 25.301px;
    height: 11.787px;
    display: block;
  }
  .status-bar .wifi {
    position: absolute;
    right: 47.23px;
    top: 18.03px;
    width: 15.946px;
    height: 11.44px;
    display: block;
  }
  .status-bar .cellular {
    position: absolute;
    right: 69.22px;
    top: 18.37px;
    width: 17.68px;
    height: 11.10px;
    display: block;
  }
  .title-bar {
    position: relative;
    width: 390px;
    height: 54.08px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16.64px;
  }
  .icon-placeholder { width: 24.96px; height: 24.96px; opacity: 0; flex-shrink: 0; }
  .timer-pill {
    display: flex;
    align-items: center;
    gap: 20.8px;
    height: 29.12px;
    width: 239.2px;
    padding-left: 8.32px;
    background: rgba(154, 154, 154, 0.5);
    border-radius: 100px;
    overflow: hidden;
    flex-shrink: 0;
  }
  .timer-ic-text {
    display: flex;
    align-items: center;
    width: max-content;
    will-change: transform;
    animation: timerTextFlow 12s linear infinite;
  }
  .timer-item {
    display: flex;
    align-items: center;
    gap: 4.16px;
    flex-shrink: 0;
    padding-right: 32px;
  }
  .timer-item .clock {
    width: 14.56px;
    height: 14.56px;
    opacity: 0.8;
    display: block;
    flex-shrink: 0;
  }
  .timer-item p {
    font-weight: 500;
    font-size: 11.44px;
    line-height: 16.64px;
    color: #ffffff;
    opacity: 0.8;
    white-space: nowrap;
  }
  @keyframes timerTextFlow {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }

  @media (prefers-reduced-motion: reduce) {
    .timer-ic-text,
    .btn p {
      animation: none;
      transform: none;
    }
  }

  /* ════════════════ 완료 오버레이 : 오늘 대화 완료 (718:17141) ════════════════ */
  /* TOP / home indicator 는 dim 위에 유지 */
  .top { z-index: 50; }
  .home-indicator { z-index: 50; }

  /* 완료 화면에서는 상단 타이머 숨김 (타이머는 타이틀 아래로 이동) */
  .timer-pill { transition: opacity 0.45s ease; }
  .frame.complete-active .timer-pill { opacity: 0; pointer-events: none; }

  .complete-dim {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 390px;
    height: 844px;
    background: rgba(0, 0, 0, 0.5);
    z-index: 40;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }
  .complete-el {
    z-index: 41;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.45s ease;
  }
  /* img : 캐릭터 배경 (casty) */
  .complete-img {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 390px;
    height: 844px;
    overflow: hidden;
    z-index: 39;
  }
  .complete-img img {
    position: absolute;
    left: -205px;
    top: 42px;
    width: 661px;
    height: 884px;
    object-fit: cover;
    display: block;
  }
  /* 하단 그라데이션 (transparent → black) */
  .complete-grad {
    position: absolute;
    left: 0;
    top: 694px;
    width: 390px;
    height: 150px;
    background: linear-gradient(to bottom, rgba(0, 0, 0, 0) 0%, #000000 100%);
    z-index: 40;
  }
  .frame.complete-active .complete-dim { opacity: 1; pointer-events: auto; }
  .frame.complete-active .complete-el  { opacity: 1; }
  .frame.complete-active .btn-home     { pointer-events: auto; }

  /* tooltip : 내일도 말 걸어 줄거지? */
  .complete-tooltip {
    position: absolute;
    left: calc(50% + 0.5px);
    transform: translateX(-50%);
    top: 674px;
    width: 157px;
    height: 44px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  /* 통통 튀는 모션 */
  .frame.complete-active .complete-tooltip {
    animation: ttBounce 1.6s ease-in-out infinite;
  }
  @keyframes ttBounce {
    0%   { transform: translateX(-50%) translateY(0); }
    12%  { transform: translateX(-50%) translateY(-9px); }
    24%  { transform: translateX(-50%) translateY(0); }
    34%  { transform: translateX(-50%) translateY(-5px); }
    44%  { transform: translateX(-50%) translateY(0); }
    52%  { transform: translateX(-50%) translateY(-2px); }
    60%  { transform: translateX(-50%) translateY(0); }
    100% { transform: translateX(-50%) translateY(0); }
  }
  .complete-tooltip .tt-box {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 36px;
    padding: 8px 12px;
    background: #ffffff;
    border-radius: 8.32px;
  }
  .complete-tooltip .tt-box p {
    width: 100%;
    font-weight: 500;
    font-size: 14px;
    line-height: 19.76px;
    color: #000000;
    text-align: center;
    white-space: nowrap;
  }
  .complete-tooltip .tt-arrow {
    width: 0;
    height: 0;
    border-left: 5.5px solid transparent;
    border-right: 5.5px solid transparent;
    border-top: 8px solid #ffffff;
  }

  /* title : 오늘 대화 완료! */
  .complete-title {
    position: absolute;
    left: calc(50% + 1px);
    transform: translateX(-50%);
    bottom: 413px;
    width: 342px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .complete-title p {
    width: 100%;
    font-weight: 700;
    font-size: 25px;
    line-height: 34px;
    color: #ffffff;
    text-align: center;
    text-transform: capitalize;
  }

  /* timer : 다음 대화까지 (타이틀 아래 고정, 흐르는 모션 없음) */
  .complete-timer {
    position: absolute;
    left: calc(50% + 0.36px);
    transform: translateX(-50%);
    top: 441px;
    height: 29px;
    padding: 0 8px;
    background: rgba(0, 0, 0, 0.4);
    border-radius: 104px;
    display: flex;
    align-items: center;
    gap: 4.16px;
    overflow: hidden;
  }
  .complete-timer .clock {
    width: 14.56px;
    height: 14.56px;
    display: block;
    flex-shrink: 0;
  }
  .complete-timer p {
    font-weight: 500;
    font-size: 11.44px;
    line-height: 16.64px;
    color: #ffffff;
    white-space: nowrap;
  }

  /* close : 닫기 X (상단 타이틀바 좌측) */
  .complete-close {
    position: absolute;
    left: 16.64px;
    top: 60.32px;
    width: 24.96px;
    height: 24.96px;
    z-index: 51;
    cursor: pointer;
  }
  .complete-close svg { display: block; width: 100%; height: 100%; }
  .frame.complete-active .complete-close { pointer-events: auto; }

  /* btn : 캐릭터 챗 홈으로 가기 */
  .btn-home {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    top: 734px;
    width: 358px;
    height: 58px;
    padding: 18px 24px;
    border-radius: 8.32px;
    background: #fc5001;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    overflow: hidden;
  }
  .btn-home p {
    flex: 1 0 0;
    min-width: 0;
    position: relative;
    z-index: 1;
    font-weight: 700;
    font-size: 18px;
    line-height: normal;
    color: #ffffff;
    text-align: center;
    word-break: break-word;
  }
  /* 광택(gloss) 스윕 애니 */
  .btn-home .shine {
    position: absolute;
    top: 0;
    left: -75%;
    width: 60%;
    height: 100%;
    background: linear-gradient(
      100deg,
      rgba(255, 255, 255, 0) 0%,
      rgba(255, 255, 255, 0.55) 50%,
      rgba(255, 255, 255, 0) 100%
    );
    transform: skewX(-20deg);
    pointer-events: none;
    will-change: left;
    animation: btnShine 2.8s ease-in-out infinite;
  }
  @keyframes btnShine {
    0%   { left: -75%; }
    55%  { left: 130%; }
    100% { left: 130%; }
  }

  @media (prefers-reduced-motion: reduce) {
    .btn-home .shine { animation: none; }
    .frame.complete-active .complete-tooltip { animation: none; }
    .complete-dim, .complete-el { transition: none; }
  }
</style>
</head>
<body>

  <!-- Dim -->
  <div class="complete-dim"></div>

  <!-- 하단 그라데이션 -->
  <div class="complete-grad complete-el"></div>

  <!-- tooltip -->
  <div class="complete-tooltip complete-el">
    <div class="tt-box"><p>내일도 말 걸어 줄거지?</p></div>
    <div class="tt-arrow"></div>
  </div>

  <!-- title -->
  <div class="complete-title complete-el">
    <p>오늘 대화 완료!</p>
    <p>내일 만남도 기대해주세요.</p>
  </div>

  <!-- timer : 다음 대화까지 (타이틀 아래) -->
  <div class="complete-timer complete-el">
    <svg class="clock" preserveAspectRatio="none" viewBox="0 0 12.4805 12.4805" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M6.24023 0C9.68638 0.000126528 12.4805 2.79406 12.4805 6.24023C12.4803 9.68631 9.68631 12.4803 6.24023 12.4805C2.79406 12.4805 0.000126531 9.68638 0 6.24023C0 2.79398 2.79398 0 6.24023 0ZM6.23926 2.51562C5.90447 2.51575 5.63307 2.78731 5.63281 3.12207V6.49902C5.63281 6.65976 5.69699 6.81497 5.81055 6.92871L7.66602 8.78418C7.90293 9.0211 8.2875 9.0211 8.52441 8.78418C8.76098 8.5473 8.76104 8.1636 8.52441 7.92676L6.8457 6.24805V3.12207C6.84545 2.78723 6.57415 2.51562 6.23926 2.51562Z" fill="white"/>
    </svg>
    <p id="completeTimerText">다음 대화까지 0시간 0분 0초</p>
  </div>

  <!-- close : 닫기 X -->
  <div class="complete-close complete-el" id="closeBtn">
    <svg viewBox="0 0 24.96 24.96" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M6.24 6.24L18.72 18.72M18.72 6.24L6.24 18.72" stroke="#ffffff" stroke-width="2.08" stroke-linecap="round"/>
    </svg>
  </div>

  <!-- btn : 캐릭터챗 둘러보기 -->
  <div class="btn-home complete-el" id="homeBtn">
    <span class="shine"></span>
    <p>캐릭터챗 둘러보기</p>
  </div>


</div>

<script>
(function () {
  var frame    = document.querySelector('.frame');
  var startBtn = document.querySelector('.btn');     /* 터치해서 시작 */
  var homeBtn  = document.getElementById('homeBtn'); /* 캐릭터챗 둘러보기 */
  var closeBtn = document.getElementById('closeBtn');
  var completeTimerText = document.getElementById('completeTimerText');

  /* 다음 대화(다음 날 자정)까지 남은 시간 — 흐르는 모션 없이 1초마다 갱신 */
  var timerId = null;
  function updateCompleteTimer() {
    var now  = new Date();
    var next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 0);
    var diff = Math.max(0, Math.floor((next - now) / 1000));
    var h = Math.floor(diff / 3600);
    var m = Math.floor((diff % 3600) / 60);
    var s = diff % 60;
    completeTimerText.textContent = '다음 대화까지 ' + h + '시간 ' + m + '분 ' + s + '초';
  }
  function startCompleteTimer() {
    updateCompleteTimer();
    timerId = setInterval(updateCompleteTimer, 1000);
  }
  function stopCompleteTimer() {
    if (timerId) { clearInterval(timerId); timerId = null; }
  }

  function showComplete() {
    frame.classList.add('complete-active');
    startCompleteTimer();
  }
  function hideComplete() {
    frame.classList.remove('complete-active');
    stopCompleteTimer();
  }

  /* 터치해서 시작 → 완료 화면 노출 */
  if (startBtn) startBtn.addEventListener('click', showComplete);

  /* 캐릭터챗 둘러보기 / 닫기 → (프로토타입) 첫 화면 복귀 */
  if (homeBtn)  homeBtn.addEventListener('click', hideComplete);
  if (closeBtn) closeBtn.addEventListener('click', hideComplete);
})();
</script>
