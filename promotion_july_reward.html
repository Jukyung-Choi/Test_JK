<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=375, initial-scale=1.0" />
  <title>7월 프로모션 보상</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, 'SF Pro Text', 'SF Pro Display', sans-serif;
    }

    /* ── Phone Shell ── */
    .screen {
      position: relative;
      width: 375px;
      height: 812px;
      background: linear-gradient(to bottom, #0e0040 0%, #5d0f69 85%);
      overflow: hidden;
      flex-shrink: 0;
    }

    /* ── Scroll Area ── */
    .scroll-area {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .scroll-area::-webkit-scrollbar { display: none; }

    .scroll-content {
      padding-top: 96px;   /* top-bar 높이 (44 status + 52 title-bar) */
      padding-bottom: 50px;
    }

    /* ── Top Bar (sticky) ── */
    .top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      background: #180245;
      display: flex;
      flex-direction: column;
      z-index: 20;
    }

    .status-bar {
      position: relative;
      height: 44px;
      width: 100%;
    }

    .status-time {
      position: absolute;
      left: 48px;
      top: 50%;
      transform: translateY(-50%);
      font-weight: 600;
      font-size: 15px;
      color: #fff;
      letter-spacing: -0.3px;
      width: 54px;
      text-align: center;
    }

    .status-icons {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .status-icons img { display: block; }

    .title-bar {
      display: flex;
      height: 52px;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }

    .icon-close {
      width: 24px;
      height: 24px;
      position: relative;
      cursor: pointer;
      flex-shrink: 0;
    }
    .icon-close::before,
    .icon-close::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      width: 14px; height: 1.5px;
      background: #fff;
      border-radius: 1px;
    }
    .icon-close::before { transform: translate(-50%,-50%) rotate(45deg); }
    .icon-close::after  { transform: translate(-50%,-50%) rotate(-45deg); }
    .icon-ph { width: 24px; height: 24px; opacity: 0; }

    /* ── Title Section ── */
    .title-section {
      padding: 48px 0 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-align: center;
      color: #fff;
    }

    /* ── Title Shimmer ── */
    @keyframes titleShimmer {
      0%   { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }

    .title-main {
      font-weight: 700;
      font-size: 34px;
      line-height: normal;
      background: linear-gradient(135deg, #ffffff 0%, #ffd6ea 45%, #ffb8d6 75%, #ffffff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      background-size: 200% 100%;
      filter: drop-shadow(0 0 14px rgba(255,180,215,0.30));
      animation: titleShimmer 1.6s linear infinite;
    }

    .title-sub {
      font-weight: 500;
      font-size: 14px;
      line-height: 20px;
      color: #fff;
    }

    /* ── Card Grid ── */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(2, 158px);
      gap: 14px;
      padding: 0 22px;
      justify-content: center;
    }

    .card {
      width: 158px;
      height: 186px;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
    }

    .card-img {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 158px;
      height: 212px;
    }
    .card-img img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    .card-dim {
      position: absolute;
      left: 0;
      top: 114px;
      width: 100%;
      height: 72px;
      background: linear-gradient(to bottom, rgba(167,100,180,0), #a764b4);
    }

    .card-caption {
      position: absolute;
      bottom: 10px;
      left: 0; right: 0;
      display: flex;
      justify-content: center;
      padding: 0 10px;
    }
    .card-caption-text {
      font-weight: 500;
      font-size: 12px;
      color: #fff;
      text-align: center;
      line-height: normal;
      width: 138px;
      word-break: break-word;
    }

    /* ── Home Indicator ── */
    .home-indicator {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 375px;
      height: 34px;
      z-index: 20;
      pointer-events: none;
    }
    .home-bar {
      position: absolute;
      bottom: 9px;
      left: 50%;
      transform: translateX(-50%);
      width: 134px;
      height: 5px;
      background: rgba(0,0,0,0.35);
      border-radius: 100px;
    }

    /* ── Confetti Canvas ── */
    #confetti-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 375px;
      height: 100%;
      pointer-events: none;
      z-index: 9999;
    }

    /* ══════════════════════════════════════
       Card Detail Modal
    ══════════════════════════════════════ */
    .card-detail {
      position: absolute;
      inset: 0;
      z-index: 200;
      background: #000;
      display: none;
      overflow: hidden;
    }
    .card-detail.open {
      display: block;
    }

    /* 배경 캐릭터 이미지 */
    .detail-bg-img {
      position: absolute;
      left: -60px;
      top: -40px;
      width: 534px;
      height: 712px;
      object-fit: cover;
      pointer-events: none;
    }

    /* 하단 그라디언트 딤 */
    .detail-dim {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 382px;
      height: 351px;
      background: linear-gradient(to top, #000 50%, rgba(0,0,0,0));
      pointer-events: none;
    }

    /* 채팅 UI 오버레이 이미지 */
    .detail-chat-img {
      position: absolute;
      left: 0;
      top: -2px;
      width: 375px;
      height: 815px;
      object-fit: cover;
      pointer-events: none;
    }

    /* 닉네임 + 대사 텍스트 */
    .detail-text {
      position: absolute;
      top: 552px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      color: #fff;
      font-weight: 700;
      font-size: 24px;
      line-height: normal;
      white-space: nowrap;
      text-transform: capitalize;
    }

    /* 버튼 영역 */
    .detail-btns {
      position: absolute;
      bottom: 51px;
      left: 50%;
      transform: translateX(-50%);
      width: 375px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .btn-orange {
      width: 319px;
      height: 52px;
      background: #fb6800;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      line-height: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-orange:active { filter: brightness(0.88); }

    .btn-gray {
      width: 319px;
      height: 52px;
      background: #f0f0f0;
      border: none;
      border-radius: 8px;
      color: #292930;
      font-size: 15px;
      font-weight: 600;
      line-height: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-gray:active { filter: brightness(0.92); }

    /* 다운로드 아이콘 */
    .ic-download {
      width: 17px;
      height: 17px;
      flex-shrink: 0;
    }

    /* 상세 상단 바 */
    .detail-top-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      display: flex;
      flex-direction: column;
      z-index: 10;
    }
    .detail-status {
      position: relative;
      height: 44px;
    }
    .detail-status-time {
      position: absolute;
      left: 48px;
      top: 50%;
      transform: translateY(-50%);
      font-weight: 600;
      font-size: 15px;
      color: #fff;
      letter-spacing: -0.3px;
    }
    .detail-status-icons {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .detail-title-bar {
      display: flex;
      height: 52px;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }
    .detail-home-bar {
      position: absolute;
      bottom: 9px;
      left: 50%;
      transform: translateX(-50%);
      width: 134px;
      height: 5px;
      background: rgba(0,0,0,0.5);
      border-radius: 100px;
    }
  </style>
</head>
<body>
<div class="screen">

  <!-- Scrollable area -->
  <div class="scroll-area">
    <div class="scroll-content">
      <!-- Title -->
      <div class="title-section">
        <p class="title-main">모든 미션 완료!</p>
        <p class="title-sub">다른 캐릭터도 만나러 가볼까요?</p>
      </div>
      <!-- Card Grid (10 cards) -->
      <div class="card-grid" id="cardGrid"></div>
    </div>
  </div>

  <!-- Top Bar (fixed over scroll) -->
  <div class="top-bar">
    <div class="status-bar">
      <span class="status-time">9:41</span>
      <div class="status-icons">
        <img src="https://www.figma.com/api/mcp/asset/ceef00fb-7821-429b-866c-8d2dee8ea754" alt="" width="17" height="12" />
        <img src="https://www.figma.com/api/mcp/asset/e67ee4b3-d3f7-4d96-bfa1-119e9a8958d8" alt="" width="15" height="11" />
        <img src="https://www.figma.com/api/mcp/asset/243868f1-1311-455b-a843-5ff88c867414" alt="" width="25" height="12" />
      </div>
    </div>
    <div class="title-bar">
      <div class="icon-close"></div>
      <div class="icon-ph"></div>
    </div>
  </div>

  <!-- Home Indicator -->
  <div class="home-indicator">
    <div class="home-bar"></div>
  </div>

  <!-- Confetti Canvas -->
  <canvas id="confetti-canvas"></canvas>

  <!-- ── Card Detail Modal ── -->
  <div class="card-detail" id="cardDetail">
    <!-- 배경 캐릭터 -->
    <img class="detail-bg-img"
         src="https://www.figma.com/api/mcp/asset/38dde212-b22e-45d9-8ced-72e0fe0211c7"
         alt="" />

    <!-- 하단 딤 -->
    <div class="detail-dim"></div>

    <!-- 채팅 UI 오버레이 -->
    <img class="detail-chat-img"
         src="https://www.figma.com/api/mcp/asset/98829c4b-fdc1-4d24-8c40-08a726c7b99c"
         alt="" />

    <!-- 상세 상단 바 -->
    <div class="detail-top-bar">
      <div class="detail-status">
        <span class="detail-status-time">9:41</span>
        <div class="detail-status-icons">
          <img src="https://www.figma.com/api/mcp/asset/6d7916f2-1962-485c-934b-08de32b22581" alt="" width="17" height="12" />
          <img src="https://www.figma.com/api/mcp/asset/3e600c1f-91b8-4ee2-96b0-e64491dba6ed" alt="" width="15" height="11" />
          <img src="https://www.figma.com/api/mcp/asset/046c2dbf-575e-4b28-9d91-f03024546b80" alt="" width="25" height="12" />
        </div>
      </div>
      <div class="detail-title-bar">
        <div class="icon-close" id="detailClose"></div>
        <div class="icon-ph"></div>
      </div>
    </div>

    <!-- 홈 인디케이터 -->
    <div style="position:absolute;bottom:0;left:0;width:375px;height:34px;">
      <div class="detail-home-bar"></div>
    </div>
  </div>

</div><!-- /.screen -->

<script>
  // ── Card Grid ──
  const CARD_IMG = 'https://www.figma.com/api/mcp/asset/57a69bdd-8c4d-403d-90c4-81be9d041bc7';
  const grid = document.getElementById('cardGrid');
  const detail = document.getElementById('cardDetail');

  for (let i = 0; i < 10; i++) {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-img"><img src="${CARD_IMG}" alt="" /></div>
      <div class="card-dim"></div>
      <div class="card-caption"><p class="card-caption-text">당신만 바라보는 남사친</p></div>
    `;
    card.addEventListener('click', openDetail);
    grid.appendChild(card);
  }

  // ── 메인 화면 마우스 드래그 스크롤 ──
  (function () {
    const area = document.querySelector('.scroll-area');
    let startY = 0, scrollStart = 0, dragging = false, moved = false;

    area.addEventListener('mousedown', function (e) {
      dragging = true;
      moved = false;
      startY = e.clientY;
      scrollStart = area.scrollTop;
      area.style.cursor = 'grabbing';
      e.preventDefault();
    });

    document.addEventListener('mousemove', function (e) {
      if (!dragging) return;
      const dy = e.clientY - startY;
      if (Math.abs(dy) > 4) moved = true;
      area.scrollTop = scrollStart - dy;
    });

    document.addEventListener('mouseup', function () {
      if (!dragging) return;
      dragging = false;
      area.style.cursor = '';
    });

    // 드래그 중이었으면 카드 클릭 무시
    area.addEventListener('click', function (e) {
      if (moved) e.stopPropagation();
    }, true);
  })();

  // ── Detail open / close ──
  function openDetail() {
    detail.classList.add('open');
  }

  // 아래로 스와이프 → 닫기 (터치 + 마우스 공용)
  (function () {
    var startY = 0, startX = 0, dy = 0, dragging = false, startTime = 0, moved = false;

    function onStart(x, y) {
      startY = y;
      startX = x;
      dy = 0;
      moved = false;
      dragging = true;
      startTime = Date.now();
    }

    function onMove(x, y) {
      if (!dragging) return;
      dy = y - startY;
      var dx = x - startX;
      if (Math.abs(dx) > Math.abs(dy)) return;
      if (dy < 0) { dy = 0; return; }
      if (dy > 4) moved = true;
    }

    function onEnd() {
      if (!dragging) return;
      dragging = false;
      var elapsed = Date.now() - startTime;
      var velocity = dy / Math.max(elapsed, 1) * 1000;

      if (moved && (dy > 100 || velocity > 400)) {
        detail.classList.remove('open');
      }
    }

    // Touch
    detail.addEventListener('touchstart',  function (e) { onStart(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
    detail.addEventListener('touchmove',   function (e) { onMove(e.touches[0].clientX, e.touches[0].clientY); },  { passive: true });
    detail.addEventListener('touchend',    onEnd);
    detail.addEventListener('touchcancel', onEnd);

    // Mouse
    detail.addEventListener('mousedown', function (e) {
      onStart(e.clientX, e.clientY);
      e.preventDefault();
    });
    document.addEventListener('mousemove', function (e) { if (dragging) onMove(e.clientX, e.clientY); });
    document.addEventListener('mouseup',   onEnd);

    // 탭(클릭) — 드래그한 경우 click 무시
    detail.addEventListener('click', function () {
      if (!moved) {
        detail.classList.remove('open');
        detail.style.transform = '';
      }
    });
  })();

  // ── Confetti burst (1회) ──
  (function () {
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 375;
    canvas.height = 812;

    const COLORS = [
      '#ffb6d9', '#ff9ecc', '#ffd6e8',
      '#ff80b5', '#ffc0d8', '#ffe0ee',
      '#f472b6', '#fbcfe8',
    ];

    function rand(a, b) { return a + Math.random() * (b - a); }

    const particles = Array.from({ length: 120 }, () => {
      const angle = rand(0, Math.PI * 2);
      const speed = rand(4, 14);
      const shape = Math.random() < 0.55 ? 'rect' : 'circle';
      return {
        x: 375 / 2,
        y: rand(80, 160),
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - rand(2, 5),
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
        shape,
        w: shape === 'rect' ? rand(7, 13) : rand(4, 9),
        h: shape === 'rect' ? rand(4, 8) : 0,
        angle: rand(0, Math.PI * 2),
        spin: rand(-0.28, 0.28),
        opacity: 1,
        decay: rand(0.012, 0.020),
      };
    });

    function draw() {
      ctx.clearRect(0, 0, 375, 812);
      let alive = false;
      for (const p of particles) {
        p.vy += 0.22;
        p.vx *= 0.98;
        p.x += p.vx;
        p.y += p.vy;
        p.angle += p.spin;
        p.opacity -= p.decay;
        if (p.opacity <= 0) continue;
        alive = true;
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.opacity);
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);
        ctx.fillStyle = p.color;
        if (p.shape === 'rect') {
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        } else {
          ctx.beginPath();
          ctx.arc(0, 0, p.w / 2, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
      if (alive) requestAnimationFrame(draw);
      else { ctx.clearRect(0, 0, 375, 812); canvas.remove(); }
    }
    draw();
  })();
</script>
</body>
</html>
